<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="250" viewBox="0 0 220 250">
  <style>
    .t{animation:bob 1.2s steps(2,end) infinite;transform-origin:center}
    .s{animation:sh 1.2s steps(2,end) infinite;transform-origin:110px 232px}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes sh{0%,100%{transform:scaleX(1);opacity:.55}50%{transform:scaleX(.8);opacity:.3}}
    @media (prefers-reduced-motion:reduce){.t,.s{animation:none}}
  </style>
  <rect class="s" x="60" y="226" width="100" height="10" fill="#1f6bff"/>
  <image class="t" x="27" y="10" width="165" height="198" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
</svg>
